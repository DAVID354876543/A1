<!DOCTYPE html>
<html>
  <head>
    <title>Navbar</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .topnav {
        overflow: hidden;
        background-color: #333;
      }
      .topnav a {
        float: left;
        color: #1affa3;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }
      .topnav a:hover {
        background-color: #ddd;
        color: black;
      }
      .topnav a.active {
        background-color: #ffe066;
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="topnav">
      <a class="active" href="#home" onclick="showMessage('This is the home page'); return false;">Home</a>
      <a href="#" onclick="showMessage('This is the About Us page'); return false;">About_Us</a>
      <a href="#" onclick="showMessage('This is the gallery page'); return false;">Gallery</a>
      <a href="#" onclick="showMessage('This is the services page'); return false;">Services</a>
      <a href="#" onclick="showMessage('This is the offer page'); return false;">Offer</a>
      <a href="#" onclick="showMessage('This is the Contact Us page'); return false;">Contact_Us</a>
    </div>
    <p id="message"></p>
    <script>
      function showMessage(text) {
        document.getElementById("message").textContent = text;
      }
    </script>
  </body>
</html>
